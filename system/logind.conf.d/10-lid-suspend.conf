# Suspend on lid close in every case, including with HDMI attached ("docked").
# logind owns suspend so a spurious wake with the lid closed is re-suspended.
# Install: sudo install -Dm0644 10-lid-suspend.conf /etc/systemd/logind.conf.d/10-lid-suspend.conf
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
