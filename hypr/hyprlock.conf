# BACKGROUND
background {
    monitor =
    path = /home/yaloalo/.config/quickshell/blackhole/assets/black-hole.png
    blur_passes = 1
    contrast = 1
    brightness = 0.42
    vibrancy = 0.32
    vibrancy_darkness = 0.25
}

# GENERAL
general {
    hide_cursor = false
    grace = 0
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(180, 142, 247, 0.9)
    inner_color = rgba(8, 7, 15, 0.72)
    font_color  = rgba(243, 239, 255, 1.0)
    fade_on_empty = false
    rounding = -1
    check_color = rgba(139, 233, 253, 1.0)
    placeholder_text = 
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(170, 162, 199, 0.9)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(243, 239, 255, 1.0)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# PROFILE PICTURE
image {
    monitor =
    path = /home/yaloalo/.config/quickshell/blackhole/assets/black-hole.png
    size = 100
    border_size = 2
    border_color = rgba(255, 121, 198, 1.0)
    position = 0, -100
    halign = center
    valign = center
}
