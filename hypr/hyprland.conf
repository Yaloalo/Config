################################################################################
# HYPRLAND CONFIG
################################################################################

#####
### Env Stuff
#####

source = ~/.config/hypr/env.conf

################
### MONITORS ###
################

# INTERNAL
monitor = eDP-1, preferred, auto, 1

# EXTERNAL 4K
monitor = HDMI-A-1, preferred, auto, 1

# DP-7
monitor = DP-7, preferred, auto, 1

# Workspace assignments
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
workspace = 12, monitor:eDP-1

# External monitor workspace
workspace = 11, monitor:HDMI-A-1

xwayland {
    force_zero_scaling = true
}

###################
### INPUT #########
###################

input {
    kb_layout  = de
    kb_options = grp:win_space_toggle

    follow_mouse = 0
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

debug {
    disable_logs       = false
    enable_stdout_logs = true
}

###################
### PROGRAMS ######
###################

$terminal = wezterm
$browser  = firefox
$menu     = wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = mako &
exec-once = hypridle
exec-once = qs -n -d
exec-once = ~/.config/scripts/toggle_border.sh &
exec-once = kanshi

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

#####################
### LOOK & FEEL #####
#####################

general {
    gaps_in      = 0
    gaps_out     = 0
    border_size  = 2

    col.active_border   = rgba(FFFFFFFF)
    col.inactive_border = rgba(00000000)

    resize_on_border = false
    allow_tearing    = false

    layout = dwindle
}

#############################
### DECORATION & BLUR #######
#############################

decoration {
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        # Default = SOFT profile:
        # - very small blur kernel (almost sharp)
        # - slightly darker background
        enabled           = true
        size              = 1          # minimal blur
        passes            = 1
        new_optimizations = on
        ignore_opacity    = yes        # affect transparent wezterm
        brightness        = 0.80       # a bit darker than the wallpaper
        vibrancy          = 0.20       # subtle color lift
        contrast          = 1.0
    }
}

##############################
### ANIMATIONS ###############
##############################

animations {
    enabled = false
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = false
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDS ######
###################

$mainMod = SUPER

# Monitor setup
bind = SUPER, M, exec, uwsm app -- ~/.config/hypr/monitor-setup.sh

# Fake fullscreen toggle (per-window)
bind = SUPER, Y, fullscreen, 1

# Hyprlock on lid
bindl = ,switch:on:Lid Switch,  exec, hyprlock --immediate
bindl = ,switch:off:Lid Switch, exec, hyprlock --immediate

# -----------------------------------------------------------------------------
# SPECIAL WORKSPACE "term" + TERMINAL / FILE MANAGER
# -----------------------------------------------------------------------------

# SUPER + T → new local terminal instance
bind = SUPER , T, exec, uwsm app -- wezterm

# SUPER + E → toggle special overlay workspace "term"
bind = SUPER, E, togglespecialworkspace, term
bind = SUPER SHIFT, E, movetoworkspacesilent, special:term

# SUPER + A → open Nautilus
bind = SUPER, A, exec, uwsm app -- nautilus

# -----------------------------------------------------------------------------
# Other launchers
# -----------------------------------------------------------------------------

bind = $mainMod, F, killactive

# Browser on SUPER+SHIFT+B (SUPER+B is blur toggle)
bind = $mainMod SHIFT, B, exec, uwsm app -- $browser

bind = SUPER, R, exec, uwsm app -- $menu
bind = SUPER, I, exec, uwsm app -- wlogout --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css

bind = SUPER, N, exec, uwsm app -- wezterm start --always-new-process -- nvim
bind = SUPER, V, exec, uwsm app -- bluetui

# Movement focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Swap windows
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, j, swapwindow, d
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, l, swapwindow, r

# Workspaces 1–10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Special workspace 10 & 11 (external / misc)
bind = $mainMod, W, workspace, 10
bind = $mainMod SHIFT, W, movetoworkspacesilent, 10

bind = $mainMod, Q, workspace, 11
bind = $mainMod SHIFT, Q, movetoworkspacesilent, 11

# Mouse-based workspace scrolling
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move / resize window with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Floating toggle (SUPER+X)
bind = SUPER, X, togglefloating

# System info
bind = SUPER, S, exec, /home/yaloalo/.config/scripts/system-info.sh

# Toggle blur profiles:
#   SUPER+B → SOFT (size=1, darken slightly)
#          ↔ HEAVY (strong blur + dark + bloom-ish)
bind = SUPER, B, exec, /home/yaloalo/.config/hypr/toggle_blur.sh

# Media keys
bindel = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = ,XF86AudioNext,  exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay,  exec, playerctl play-pause
bindl = ,XF86AudioPrev,  exec, playerctl previous

##############################
### WINDOW RULES #############
##############################

#windowrule = suppressevent maximize, class:.*
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# If you start a wezterm with class "global-term", it will live on special:term
windowrulev2 = workspace special:term, class:^(global-term)$
windowrulev2 = float,                 class:^(global-term)$
windowrulev2 = size 100% 100%,        class:^(global-term)$
windowrulev2 = move 0 0,              class:^(global-term)$
# Obsidian: 90% opacity when active and inactive
#windowrulev2 = opacity 0.9 0.9,class:^(obsidian)$
##############################
### MISC KEYS ###############
##############################

bind = SUPER, P, exec, /home/yaloalo/.config/hypr/screenshot-area.sh
