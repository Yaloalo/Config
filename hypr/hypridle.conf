
general {
    # Wait for the Wayland session lock before allowing the laptop to sleep.
    inhibit_sleep = 3
    lock_cmd = qs -p /home/yaloalo/.config/quickshell/blackhole/lock.qml -n -d
    # Lock, pause media and disconnect Bluetooth devices before every suspend.
    before_sleep_cmd = /home/yaloalo/.config/scripts/before-sleep.sh
    after_sleep_cmd = /home/yaloalo/.config/scripts/after-sleep.sh
}

# This version of hypridle requires a listener. It has no practical idle
# action; lock and suspend still happen only on request or lid close.
listener {
    timeout = 315360000
    on-timeout = true
}
