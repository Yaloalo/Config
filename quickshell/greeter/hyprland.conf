# Minimal compositor for the NERV greeter. greetd runs it as user "greeter";
# installed to /etc/greetd/desktop/greeter/ by scripts/desktop-mode-install.sh.
# Legacy hyprlang on purpose: it only needs a few static settings.

# Same layout as ~/.config/hypr/monitors.lua; anything else just turns on.
monitor = eDP-1, 2560x1600@60, 5440x176, 1.333333
monitor = HDMI-A-1, 3840x2160@60, 1600x0, 1
monitor = , preferred, auto, 1

input {
    kb_layout = de
    kb_options = grp:win_space_toggle
    touchpad {
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = false
}

cursor {
    inactive_timeout = 3
}

# When the greeter quits after handing the session to greetd, close the
# compositor so greetd can start the pilot's session.
exec-once = sh -c 'qs -p /etc/greetd/desktop/greeter; hyprctl dispatch exit'
