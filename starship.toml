add_newline = true
command_timeout = 1000
palette = "infinity"

format = """
$os$username$hostname$directory$git_branch$git_state$git_status$fill$cmd_duration$python$time
$character"""

[palettes.infinity]
void = "#010207"
mantle = "#0a0f19"
surface = "#111a2a"
outline = "#30435e"
text = "#f7fbff"
muted = "#8190a5"
ice = "#dff8ff"
blue = "#58baff"
cobalt = "#376dff"
red = "#ff607c"
green = "#79c99e"

[os]
disabled = false
format = "[](blue)[$symbol](bold void)[ ](blue)"

[os.symbols]
Arch = " "
Linux = " "

[username]
show_always = true
format = "[$user](bold ice)"

[hostname]
ssh_only = false
format = "[@$hostname](muted) "

[directory]
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
style = "bold text"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold blue"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "ice"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "blue"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
format = "[󰔛 $duration](muted) "

[python]
format = "[ ${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "ice"

[time]
disabled = false
time_format = "%H:%M"
format = "[󰥔 $time](muted)"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold ice)"
vimcmd_replace_one_symbol = "[❮](bold blue)"
vimcmd_replace_symbol = "[❮](bold red)"
vimcmd_visual_symbol = "[❮](bold ice)"
