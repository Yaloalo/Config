add_newline = true
command_timeout = 1000
palette = "event_horizon"

format = """
$os$username$hostname$directory$git_branch$git_state$git_status$fill$cmd_duration$python$time
$character"""

[palettes.event_horizon]
void = "#090603"
mantle = "#140b07"
surface = "#2a160c"
outline = "#70401f"
text = "#fff4e8"
muted = "#b99a80"
amber = "#ffb347"
ember = "#ff6a1a"
gold = "#ffd27a"
red = "#ff4f32"
green = "#8fbf73"

[os]
disabled = false
format = "[](ember)[$symbol](bold void)[ ](ember)"

[os.symbols]
Arch = " "
Linux = " "

[username]
show_always = true
format = "[$user](bold amber)"

[hostname]
ssh_only = false
format = "[@$hostname](muted) "

[directory]
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
style = "bold gold"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold ember"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "amber"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "amber"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
format = "[󰔛 $duration](muted) "

[python]
format = "[ ${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "gold"

[time]
disabled = false
time_format = "%H:%M"
format = "[󰥔 $time](muted)"

[character]
success_symbol = "[❯](bold ember)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold gold)"
vimcmd_replace_one_symbol = "[❮](bold amber)"
vimcmd_replace_symbol = "[❮](bold red)"
vimcmd_visual_symbol = "[❮](bold gold)"
